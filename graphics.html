<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>SVG Graphics</title>
    </head>
    <body>
        <!-- Simple SVG circle -->
         <svg width="100" height="100">
            <circle cx="50" cy="50" r="40" stroke="black" stroke-width="2" fill="red" />
         </svg>

    </body>
</html>
