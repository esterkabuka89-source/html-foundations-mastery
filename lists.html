<!DOCTYPE html>
<html>
    <head>
        <title>Lists</title>

    </head>
    <body>
        <h1>fruits</h1>
        <ul>
            <li>Apple</li>
            <li>Banana</li>
            <li>Orange</li>
            <li>Grapes</li>
        </ul>

        <h1>Steps to make coffee</h1>
        <ol>
            <li>Boil water</li>
            <li>Add coffee grounds to cup.</li>
            <li>Pour hot water to the cup.</li>
            <li>Stir and let it steep for two minutes.</li>
            <li>Add milk and sugar if desired.</li>
            <li>Enjoy your coffee.</li>
        </ol>
    </body>
</html>
